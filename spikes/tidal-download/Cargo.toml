[package]
name = "tidal-download"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
claxon = "0.4"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tidlers = "=0.5.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
roxmltree = "0.21"
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
flacenc = "0.5"

# Independent host workspace; never inherit the firmware workspace/toolchain.
[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
