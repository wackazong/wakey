  <text class="d-text d-text--mono" x="614" y="38">wakey-core</text>
  <text class="d-text d-text--small" x="614" y="64">a separate crate</text>
  <text class="d-text d-text--small" x="614" y="84">pure logic</text>
  <text class="d-text d-text--small" x="614" y="104">no ESP dependencies</text>
  <text class="d-text d-text--small" x="614" y="124">tested on the host</text>
