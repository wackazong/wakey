  <rect class="d-box--soft" x="218" y="188" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="262" y="213" text-anchor="middle">clock</text>
  <rect class="d-box--soft" x="314" y="188" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="358" y="213" text-anchor="middle">net</text>
  <rect class="d-box--soft" x="410" y="188" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="454" y="213" text-anchor="middle">airdrop</text>
  <rect class="d-box--dashed" x="6" y="274" width="554" height="78" rx="6"/>
  <text class="d-text d-text--small" x="548" y="293" text-anchor="end">Hardware</text>
  <rect class="d-box--soft" x="26" y="302" width="88" height="36" rx="4"/>
