  <text class="d-text d-text--mono" x="70" y="161" text-anchor="middle">audio</text>
  <rect class="d-box--soft" x="122" y="136" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="166" y="161" text-anchor="middle">tidal</text>
  <rect class="d-box--soft" x="218" y="136" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="262" y="161" text-anchor="middle">http</text>
  <rect class="d-box--soft" x="314" y="136" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="358" y="161" text-anchor="middle">sounds</text>
  <rect class="d-box--soft" x="410" y="136" width="88" height="40" rx="4"/>
  <text class="d-text d-text--mono" x="454" y="161" text-anchor="middle">config</text>
  <rect class="d-box--soft" x="26" y="188" width="88" height="40" rx="4"/>
