<svg viewBox="0 0 760 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The four layers of the firmware crate, top to bottom: app; the services ui, audio, net, tidal, http, airdrop, sounds, clock, config and ambient; the hardware modules board, display and c6; the support modules runtime, psram and taskstats. Arrows point downwards from a module to one it uses. The crate wakey-core stands beside the layers and is used by app and by the services.">
  <title>The layers of the firmware and their modules</title>
  <defs>
    <marker id="layers-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="d-box--dashed" x="6" y="8" width="554" height="74" rx="6"/>
  <text class="d-text d-text--small" x="548" y="27" text-anchor="end">Application</text>
  <rect class="d-box--accent" x="26" y="36" width="472" height="36" rx="4"/>
  <text class="d-text d-text--mono d-text--on-accent" x="42" y="59">app</text>
  <text class="d-text d-text--small d-text--on-accent" x="90" y="59">screens, wiring, UI texts</text>
  <rect class="d-box--dashed" x="6" y="108" width="554" height="140" rx="6"/>
