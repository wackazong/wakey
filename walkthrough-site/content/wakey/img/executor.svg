<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The executor's loop on the app thread: poll the tasks that were woken, run the app task until an await has nothing ready, sleep on a condition variable. Three things wake it: the frame-done interrupt, a timer, and a touch event.">
  <title>The executor's loop and what wakes it</title>
  <defs>
    <marker id="ex-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ex-head-spark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-head--spark" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="d-box--dashed" x="6" y="8" width="444" height="284" rx="6"/>
  <text class="d-text d-text--small" x="24" y="32">thread "app" · core 0 · priority 1 · 64 KiB stack</text>
  <rect class="d-box--soft" x="50" y="50" width="370" height="54" rx="4"/>
  <text class="d-text d-text--mono" x="68" y="73">Executor::poll</text>
  <text class="d-text d-text--small" x="68" y="92">polls every task that was woken</text>
  <rect class="d-box--accent" x="50" y="130" width="370" height="60" rx="4"/>
  <text class="d-text d-text--mono d-text--on-accent" x="68" y="155">task app::app</text>
  <text class="d-text d-text--small d-text--on-accent" x="68" y="175">runs until an .await has nothing ready</text>
  <rect class="d-box--soft" x="50" y="216" width="370" height="54" rx="4"/>
  <text class="d-text d-text--mono" x="68" y="239">Signaler::wait</text>
  <text class="d-text d-text--small" x="68" y="258">the thread sleeps on a Condvar</text>
  <path class="d-line" d="M235 104v24" marker-end="url(#ex-head)"/>
  <path class="d-line" d="M235 190v24" marker-end="url(#ex-head)"/>
  <path class="d-line" d="M50 243H28V77h20" marker-end="url(#ex-head)"/>
  <rect class="d-box--spark" x="530" y="34" width="222" height="56" rx="4"/>
  <text class="d-text" x="546" y="57">frame-done interrupt</text>
  <text class="d-text d-text--small" x="546" y="76">HalIsrNotification</text>
  <rect class="d-box--spark" x="530" y="122" width="222" height="56" rx="4"/>
  <text class="d-text" x="546" y="145">a timer ran out</text>
  <text class="d-text d-text--small" x="546" y="164">embassy-time driver (esp_timer)</text>
  <rect class="d-box--spark" x="530" y="210" width="222" height="56" rx="4"/>
  <text class="d-text" x="546" y="233">a touch event</text>
  <text class="d-text d-text--small" x="546" y="252">thread "touch" → EVENTS channel</text>
  <path class="d-line d-line--spark" d="M530 62C480 62 478 232 424 240" marker-end="url(#ex-head-spark)"/>
  <path class="d-line d-line--spark" d="M530 150C490 150 480 238 424 243" marker-end="url(#ex-head-spark)"/>
  <path class="d-line d-line--spark" d="M530 238C490 238 470 246 424 246" marker-end="url(#ex-head-spark)"/>
  <text class="d-text d-text--small d-text--spark" x="462" y="282">wake: signal the Condvar</text>
</svg>
