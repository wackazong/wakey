[package]
name = "wakey-firmware"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Tab5 alarm clock firmware: ESP-IDF (std) + Embassy"

# The firmware is its own Cargo workspace: its target, build-std and
# toolchain must not leak into host crates.
[workspace]

[lib]
name = "wakey"
path = "src/lib.rs"
test = false
bench = false

# Applications live in src/bin/; `cargo run --release --bin <name>`.

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
mem_forget = "deny"
large_stack_frames = "deny"

[dependencies]
# Hardware-independent logic (dates, audio files, resampling, descriptors,
# config, scroll physics), tested on the host.
wakey-core = { path = "../wakey-core" }
esp-idf-svc = { version = "0.53", features = ["std", "binstart", "alloc", "embassy-time-driver", "embassy-sync", "critical-section"] }
esp-idf-hal = "0.47"
esp-idf-sys = "0.38.1"
log = "0.4"
anyhow = "1"

# Async runtime: Embassy's executor on top of FreeRTOS (std platform),
# time driver from esp-idf-svc.
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread", "log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"


slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }
# Path drawing (the icons in `ui/wakey/theme.slint`).
i-slint-renderer-software = { version = "1.18.1", default-features = false, features = ["path"] }
heapless = "0.9"
qrcodegen = "1.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
embuild = "0.33.7"
slint-build = "1.18.1"

[features]
# Scripted touch gestures after boot and a per-frame trace in the log
# (`app::bench`, `ui::trace`); see README.md, "Measure the UI on the device".
ui-bench = []
# The clock's sky runs through today in one minute, over and over; the
# bottom line shows that time and the sun's elevation (`app::clock_screen`).
sky-demo = []
# A debug overlay at the top left of every page: pixel dimming,
# backlight, light reading, and when the display sleeps (or why not).
debug-overlay = []
# The display sleeps and wakes every 8 s by itself (ignores the sleep
# conditions); the render loop logs the PSRAM around each link rebuild.
sleep-cycle-test = []
# Logs CPU time per task every 5 s (`taskstats`).
task-stats = []
# Samples core 0 (Wi-Fi, TLS) during the first TIDAL download (with
# download-bench: its second round) and logs the hottest addresses and the
# callers of time with interrupts off (`profiler`; scripts/profile.sh).
profile-download = []
# After boot, downloads the TIDAL playlist's first track twice to a
# scratch file and once without writing it; logs speeds and the link.
download-bench = []
# Updates the C6's esp_hosted firmware over SDIO (slave OTA) in the first
# Wi-Fi session if it runs another version than the image, then restarts.
# The image is c6/esp_hosted_slave-2.13.1-esp32c6.bin (c6/README.md).
c6-update = []
# USB-A switched on and off at random 50–3000 ms intervals (the USB host's
# handling of power changes during enumeration; `app::power`).
usb-cycle-test = []
# At start: Wi-Fi sessions in growing stages (driver; connect; one HTTPS
# request), five each, logging the free heap after each (`net::leak_test`).
wifi-leak-test = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2          # symbols stay in the ELF only, not in the flashed image

[profile.dev]
# Unoptimized builds are far too slow for drawing.
opt-level = "s"
debug = 2

# Extra ESP-IDF bindings (no extra component is built).
[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "bindings/extra.h"

# Wi-Fi through the on-board ESP32-C6 (SDIO): Espressif's esp_hosted
# transport and the esp_wifi_remote API shim, so esp_wifi (and EspWifi)
# work on the radio-less P4. Host 2.x talks to the Tab5's factory C6
# firmware (esp_hosted slave 1.4.1); 3.x is a different protocol.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_hosted", version = "==2.13.1" }
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_remote", version = "==1.6.5" }

# Slint's software renderer with a glyph fast path (vendor/README.md).
[patch.crates-io]
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
i-slint-core = { path = "vendor/i-slint-core" }
# HTTP client: headers of the previous request deleted on a reused
# connection, TLS session tickets (vendor/README.md).
esp-idf-svc = { path = "vendor/esp-idf-svc" }
